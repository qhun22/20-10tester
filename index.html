<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#fff3f7">
    <title>Nhập mật khẩu</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <main class="passcode-screen">
        <section class="passcode-card" aria-labelledby="passcode-title">
            <div class="lock-icon" aria-hidden="true">♡</div>
            <h1 id="passcode-title">Nhập pass nha</h1>
            <p class="passcode-subtitle">Mở món quà dành riêng cho bạn</p>

            <div class="passcode-dots" aria-label="Mã gồm 4 chữ số">
                <span class="passcode-dot"></span>
                <span class="passcode-dot"></span>
                <span class="passcode-dot"></span>
                <span class="passcode-dot"></span>
            </div>
            <p id="passcode-message" class="passcode-message" aria-live="polite"></p>

            <div class="keypad" aria-label="Bàn phím nhập mã">
                <button type="button" class="key" data-key="1">1</button>
                <button type="button" class="key" data-key="2">2</button>
                <button type="button" class="key" data-key="3">3</button>
                <button type="button" class="key" data-key="4">4</button>
                <button type="button" class="key" data-key="5">5</button>
                <button type="button" class="key" data-key="6">6</button>
                <button type="button" class="key" data-key="7">7</button>
                <button type="button" class="key" data-key="8">8</button>
                <button type="button" class="key" data-key="9">9</button>
                <span class="keypad-placeholder" aria-hidden="true"></span>
                <button type="button" class="key" data-key="0">0</button>
                <button type="button" class="key key-delete" data-action="delete" aria-label="Xóa số cuối">×</button>
            </div>
        </section>
    </main>

    <script>
        (function () {
            const correctPin = "1111";
            let enteredPin = "";
            const dots = document.querySelectorAll(".passcode-dot");
            const message = document.getElementById("passcode-message");

            function updateDots() {
                dots.forEach(function (dot, index) {
                    dot.classList.toggle("is-filled", index < enteredPin.length);
                });
            }

            function submitPin() {
                if (enteredPin === correctPin) {
                    message.textContent = "Đúng rồi, đang mở quà...";
                    message.classList.remove("is-error");
                    window.location.href = "flower.html";
                    return;
                }

                message.textContent = "Pass chưa đúng, thử lại nha";
                message.classList.add("is-error");
                enteredPin = "";
                updateDots();
            }

            function addDigit(digit) {
                if (enteredPin.length >= 4) {
                    return;
                }

                enteredPin += digit;
                message.textContent = "";
                message.classList.remove("is-error");
                updateDots();

                if (enteredPin.length === 4) {
                    window.setTimeout(submitPin, 180);
                }
            }

            document.querySelectorAll("[data-key]").forEach(function (button) {
                button.addEventListener("click", function () {
                    addDigit(button.dataset.key);
                });
            });

            document.querySelector("[data-action='delete']").addEventListener("click", function () {
                enteredPin = enteredPin.slice(0, -1);
                message.textContent = "";
                message.classList.remove("is-error");
                updateDots();
            });

            document.addEventListener("keydown", function (event) {
                if (/^[0-9]$/.test(event.key)) {
                    addDigit(event.key);
                } else if (event.key === "Backspace") {
                    enteredPin = enteredPin.slice(0, -1);
                    updateDots();
                }
            });
        }());
    </script>
</body>

</html>
